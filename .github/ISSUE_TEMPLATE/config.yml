blank_issues_enabled: false
contact_links:
  - name: How to contribute
    url: https://github.com/irl-commons/irl-commons/blob/main/CONTRIBUTING.md
    about: Sources, check dates and conflicts of interest, before you open an issue.
  - name: No GitHub account? Write an email
    url: https://github.com/irl-commons/irl-commons/blob/main/CONTRIBUTING.md#no-github-account
    about: Send the entry, the source and the date you read it to hello@openstreambox.org. A steward files it for you.
  - name: No GitHub account? Ask on Discord
    url: https://discord.gg/3B9b9n9N6
    about: Post the entry, the source and the date you read it on Discord. A steward files it for you.
  - name: Report a security problem privately
    url: https://github.com/irl-commons/irl-commons/security/advisories/new
    about: For weaknesses in the workflows or publishing, or leaked credentials. Not for wrong data.
