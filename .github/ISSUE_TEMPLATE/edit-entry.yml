name: Fix or update an entry
description: Something in an entry is wrong or out of date.
title: "Update: "
labels: ["form: edit"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the fix. Sources decide: please link the public page that shows the right information.
        A steward reads this form and can turn it into a draft pull request with you as co-author.
        Do you make or sell this product, or a competing one? Please use the "Edit request from the maker" form instead.
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The dataset and the id, for example services/moblin.
      placeholder: services/moblin
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      description: Only needed when the entry above has no dataset in front of the id.
      options:
        - "words: the word list"
        - "answers: quick checks for common problems"
        - "services: apps, relays, receivers, hardware and communities"
        - "guides: tutorials from the makers"
        - "standards: shared formats and protocols"
        - "plans: mobile carriers and their plans"
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: New name
      description: Only if the name changed. Write it the way the maker writes it.
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: New link
      description: Only if the main link changed. The product's or the page's own https link.
      placeholder: https://
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Source you read
      description: A public https page from the maker, the standard or the platform. No chat links and no forum posts.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: read_on
    attributes:
      label: Date you read it
      description: Year-month-day, for example 2026-11-15.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: What is wrong or out of date, and what the source says now.
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Changed fields as JSON (optional)
      description: |
        Only if you know the data format. The fields to change and their new values, for example {"status": "Discontinued"}.
        Leave it empty if you are not sure. A steward can do this part.
      render: json
    validations:
      required: false
  - type: dropdown
    id: conflict
    attributes:
      label: Do you work for, get paid by, or own this product or a competing one?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: conflict_details
    attributes:
      label: If yes, what is the connection?
      description: For example "I work for the maker" or "I make a competing app". This is fine, it only means an independent steward reviews it.
    validations:
      required: false
