name: Fix or update an entry
description: Something in an entry is wrong or out of date.
title: "Update: "
labels: ["form: edit"]
body:
  - type: markdown
    attributes:
      value: |
        We require changes to be backed with a public source. Do you make or sell this product, or a competing one? Use the "Edit request from the maker" form instead.
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The dataset and the id, for example services/moblin.
      placeholder: services/moblin
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      description: Only needed when the entry above has no dataset in front of the id.
      options:
        - "words: IRL streaming terms"
        - "answers: quick checks for common problems"
        - "services: apps, relays, receivers, hosted services, hardware and docs"
        - "guides: public tutorials"
        - "standards: shared formats and protocols"
        - "plans: mobile carriers and their plans"
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: New name
      description: Only if the name changed. Write it the way the maker writes it.
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: New link
      description: Only if the official link changed.
      placeholder: https://
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Source you read
      description: A public https page from the maker, the standard or the platform. No chat links and no forum posts.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: read_on
    attributes:
      label: Date you read it
      description: Year-month-day, for example 2026-11-15. Leave it empty if you read it today.
      placeholder: YYYY-MM-DD
    validations:
      required: false
  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: What is wrong or out of date, and what the source says now.
    validations:
      required: true
  - type: checkboxes
    id: tags
    attributes:
      label: Tags (apps and services only, optional)
      description: Tick what the product can do, if its entry doesn't say so yet. To remove a tag, say so under "What changed".
      options:
        - label: "camera-in: takes the picture from a standalone camera, such as a DSLR, mirrorless or action camera, over HDMI, USB or the network"
        - label: "multi-camera: shows several cameras in one scene at once"
        - label: "scene-control: switches the scenes in OBS or a hub from outside it, by remote, chat commands or on its own"
  - type: textarea
    id: product_label
    attributes:
      label: The label a product uses, and why (optional)
      description: Only for words in the naming guide. The label as the app's settings show it, for example "SRT latency (ms)", and why it fits.
    validations:
      required: false
  - type: dropdown
    id: conflict
    attributes:
      label: Do you work for, get paid by, or own this product or a competing one?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: conflict_details
    attributes:
      label: If yes, what is the connection?
      description: For example "I work for the maker" or "I make a competing app". This is fine, it only means an independent steward reviews it.
    validations:
      required: false
