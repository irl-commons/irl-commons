name: Edit request from the maker
description: You make, sell or work on this product, or on a competing one, and want an entry changed.
title: "Maker edit: "
labels: ["form: maker edit"]
body:
  - type: markdown
    attributes:
      value: |
        We require changes to be backed with a public source. An independent steward checks and decides.
  - type: input
    id: entry
    attributes:
      label: Entry
      description: The dataset and the id, for example services/moblin.
      placeholder: services/moblin
    validations:
      required: true
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      description: Only needed when the entry above has no dataset in front of the id.
      options:
        - "words: IRL streaming terms"
        - "answers: quick checks for common problems"
        - "services: apps, relays, receivers, hosted services, hardware and docs"
        - "guides: public tutorials"
        - "standards: shared formats and protocols"
        - "plans: mobile carriers and their plans"
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: New name
      description: Only if the name changed.
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: New link
      description: Only if the official link changed.
      placeholder: https://
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Source you read
      description: A public https page that shows the change, for example your release notes or product page.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: read_on
    attributes:
      label: Date you read it
      description: Year-month-day, for example 2026-11-15. Leave it empty if you read it today.
      placeholder: YYYY-MM-DD
    validations:
      required: false
  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: What is wrong or out of date, and what the source says now. No ranking or advertising.
    validations:
      required: true
  - type: textarea
    id: product_label
    attributes:
      label: The label your product uses, and why (optional)
      description: Only for words in the naming guide. The label as your settings show it, for example "SRT latency (ms)", and why it fits.
    validations:
      required: false
  - type: textarea
    id: conflict_details
    attributes:
      label: Your connection to the product
      description: For example "I build this app" or "I work for a company that makes a competing relay".
    validations:
      required: true
