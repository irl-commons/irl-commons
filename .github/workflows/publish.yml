name: Publish package
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  verify:
    if: github.repository_owner == 'irl-commons' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bun run export && git diff --exit-code -- schema/json
      - name: Require a version tag matching the reviewed package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
  publish:
    needs: verify
    if: github.repository_owner == 'irl-commons' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require an npm CLI with staging support
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; const [major, minor] = execFileSync("npm", ["--version"], {encoding:"utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) process.exit(1)'
          npm stage --help
      - run: npm stage publish --ignore-scripts --provenance --access public
